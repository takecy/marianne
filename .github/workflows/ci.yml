name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm fmt:check

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium for Mermaid SSR
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ./site exec playwright install --with-deps chromium

      - name: Build docs site
        run: pnpm docs:build
        # Verifies the site/ source compiles end-to-end (MDX parsing, Mermaid
        # SSR via Playwright, Pagefind indexing). A strict diff against the
        # committed /docs/ would be ideal but is structurally impossible:
        # Mermaid assigns a fresh `id="mermaid-N"` to every <svg> per build,
        # and Astro's _astro/*.css filenames are content-hashed so any byte
        # difference cascades into new filenames. The build step here at least
        # catches "I forgot to rebuild before commit and the source no longer
        # compiles" — the page-staleness case is left to developer discipline
        # (the getting-started doc spells out `pnpm docs:build` before commit).
